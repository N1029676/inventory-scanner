<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Scanner</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #667085;
    --border: #e1e4e8; --accent: #2563eb; --accent-text: #fff;
    --danger: #c62828; --ok: #1b873f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --card: #1a1d21; --text: #eceef1; --muted: #98a2b3;
      --border: #2d3238; --accent: #3b82f6; --danger: #ef5350; --ok: #4cc06a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  h1 { font-size: 1.25rem; margin: 0; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; min-height: 44px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; padding: 10px; min-height: 44px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .viewport {
    position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
    border-radius: 8px; overflow: hidden; margin-bottom: 8px;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reticle {
    position: absolute; inset: 20%; border: 3px solid rgba(255,255,255,.8);
    border-radius: 12px; pointer-events: none; transition: border-color .15s;
  }
  .viewport.hit .reticle { border-color: #4ade80; }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #9aa3af; text-align: center; padding: 16px;
  }
  #status { color: var(--muted); font-size: .9rem; min-height: 1.3em; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  li .val { flex: 1; min-width: 0; word-break: break-all; }
  li .meta { color: var(--muted); font-size: .8rem; }
  li .count {
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 10px; font-variant-numeric: tabular-nums; font-size: .9rem;
  }
  li button { min-height: 36px; padding: 4px 10px; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0 8px; }
  h2 { font-size: 1rem; margin: 0; }
  canvas { display: none; }
</style>
</head>
<body>
<main>
  <h1>Inventory Scanner</h1>

  <section>
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted></video>
      <div class="reticle"></div>
      <div class="placeholder" id="placeholder">Camera is off</div>
    </div>
    <div class="row">
      <button class="primary" id="toggleBtn">Start camera</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <canvas id="canvas"></canvas>
  </section>

  <section>
    <form class="row" id="manualForm" autocomplete="off">
      <input type="text" id="manualInput" placeholder="Enter a code manually" aria-label="Manual code entry">
      <button type="submit">Add</button>
    </form>
  </section>

  <section>
    <div class="row" style="justify-content: space-between">
      <h2>Items (<span id="itemCount">0</span>)</h2>
      <div class="row">
        <button class="primary" id="exportBtn">Export JSON</button>
        <button class="danger" id="clearBtn">Clear all</button>
      </div>
    </div>
    <ul id="list"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
  'use strict';

  /* ---------- Persistence layer (swap for fetch() to a REST API later) ---------- */
  const STORAGE_KEY = 'inventory-scanner:v1';
  let memoryFallback = [];   // used if localStorage is unavailable

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return memoryFallback;
    }
  }

  function saveItems(items) {
    memoryFallback = items;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      return true;
    } catch (e) {
      return false;
    }
  }

  // Dedupe by value: increment count, otherwise insert. Returns the record.
  function recordScan(value) {
    const items = loadItems();
    const now = new Date().toISOString();
    let item = items.find(i => i.value === value);
    if (item) {
      item.count += 1;
      item.lastScannedAt = now;
    } else {
      item = { value, count: 1, firstScannedAt: now, lastScannedAt: now };
      items.push(item);
    }
    const persisted = saveItems(items);
    return { item, persisted };
  }

  function deleteItem(value) {
    saveItems(loadItems().filter(i => i.value !== value));
  }

  function clearItems() { saveItems([]); }

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const viewport = $('viewport'), placeholder = $('placeholder');
  const toggleBtn = $('toggleBtn'), statusEl = $('status');
  const listEl = $('list'), countEl = $('itemCount');

  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = kind || '';
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleString();
  }

  function render() {
    const items = loadItems().slice().sort((a, b) => b.lastScannedAt.localeCompare(a.lastScannedAt));
    countEl.textContent = items.length;
    listEl.textContent = '';
    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.style.display = 'block';
      li.style.borderTop = '0';
      li.textContent = 'No items scanned yet';
      listEl.appendChild(li);
      return;
    }
    for (const it of items) {
      const li = document.createElement('li');
      const left = document.createElement('div');
      left.className = 'val';
      const v = document.createElement('div');
      v.textContent = it.value;            // textContent: QR content is untrusted
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = 'Last: ' + fmtTime(it.lastScannedAt);
      left.append(v, m);
      const c = document.createElement('span');
      c.className = 'count';
      c.textContent = '×' + it.count;
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.setAttribute('aria-label', 'Delete ' + it.value);
      del.addEventListener('click', () => { deleteItem(it.value); render(); });
      li.append(left, c, del);
      listEl.appendChild(li);
    }
  }

  /* ---------- Scan handling ---------- */
  const DEBOUNCE_MS = 2000;
  let lastValue = null, lastValueAt = 0;

  function handleScan(value) {
    const now = Date.now();
    if (value === lastValue && now - lastValueAt < DEBOUNCE_MS) {
      lastValueAt = now;   // still in view: keep suppressing
      return;
    }
    lastValue = value; lastValueAt = now;
    const { item, persisted } = recordScan(value);
    render();
    viewport.classList.add('hit');
    setTimeout(() => viewport.classList.remove('hit'), 400);
    if (navigator.vibrate) navigator.vibrate(60);
    setStatus(
      (persisted ? 'Scanned: ' : 'Scanned (NOT saved - storage unavailable): ') + value + ' (×' + item.count + ')',
      persisted ? 'ok' : 'error'
    );
  }

  /* ---------- Camera loop ---------- */
  let stream = null, rafId = 0, lastTick = 0;
  const SCAN_INTERVAL_MS = 100; // ~10 fps

  async function startCamera() {
    if (typeof jsQR !== 'function') {
      setStatus('QR decoder failed to load (check network). Manual entry still works.', 'error');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Camera API unavailable. Use HTTPS or localhost.', 'error');
      return;
    }
    toggleBtn.disabled = true;
    setStatus('Requesting camera…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      placeholder.hidden = true;
      toggleBtn.textContent = 'Stop camera';
      setStatus('Scanning…');
      lastTick = 0;
      rafId = requestAnimationFrame(tick);
    } catch (e) {
      stopCamera(true);
      const msgs = {
        NotAllowedError: 'Camera permission denied.',
        NotFoundError: 'No camera found.',
        NotReadableError: 'Camera is in use by another app.',
        OverconstrainedError: 'No camera matches the requested settings.'
      };
      setStatus(msgs[e.name] || ('Camera error: ' + (e.message || e.name)), 'error');
    } finally {
      toggleBtn.disabled = false;
    }
  }

  function stopCamera(keepStatus) {
    cancelAnimationFrame(rafId);
    rafId = 0;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    placeholder.hidden = false;
    toggleBtn.textContent = 'Start camera';
    if (!keepStatus) setStatus('Camera stopped.');
  }

  function tick(ts) {
    if (!stream) return;
    rafId = requestAnimationFrame(tick);
    if (ts - lastTick < SCAN_INTERVAL_MS) return;
    lastTick = ts;
    if (video.readyState < video.HAVE_ENOUGH_DATA || !video.videoWidth) return;

    // Downscale large frames to keep decoding fast.
    const maxW = 640;
    const scale = Math.min(1, maxW / video.videoWidth);
    const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    ctx.drawImage(video, 0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (code && code.data) handleScan(code.data);
  }

  /* ---------- Export ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }

  function exportJson() {
    const items = loadItems();
    const d = new Date();
    const payload = { exportedAt: d.toISOString(), items };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'inventory-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
                 '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus('Exported ' + items.length + ' item(s).', 'ok');
  }

  /* ---------- Wiring ---------- */
  toggleBtn.addEventListener('click', () => { stream ? stopCamera() : startCamera(); });
  $('exportBtn').addEventListener('click', exportJson);
  $('clearBtn').addEventListener('click', () => {
    if (loadItems().length && confirm('Delete all scanned items?')) { clearItems(); render(); setStatus('Cleared.'); }
  });
  $('manualForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('manualInput');
    const v = input.value.trim();
    if (!v) return;
    lastValue = null;              // manual entries bypass the debounce
    handleScan(v);
    input.value = '';
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) stopCamera(); });

  render();
})();
</script>
</body>
</html>
