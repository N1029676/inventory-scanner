<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Scanner</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #667085;
    --border: #e1e4e8; --accent: #2563eb; --accent-text: #fff;
    --danger: #c62828; --ok: #1b873f; --active: #eff6ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --card: #1a1d21; --text: #eceef1; --muted: #98a2b3;
      --border: #2d3238; --accent: #3b82f6; --danger: #ef5350; --ok: #4cc06a; --active: #172033;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  section.current { background: var(--active); border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }
  button {
    font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; min-height: 44px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.small { min-height: 36px; padding: 4px 10px; font-size: .9rem; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; padding: 10px; min-height: 44px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .viewport {
    position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
    border-radius: 8px; overflow: hidden; margin-bottom: 8px;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reticle {
    position: absolute; inset: 20%; border: 3px solid rgba(255,255,255,.8);
    border-radius: 12px; pointer-events: none; transition: border-color .15s;
  }
  .viewport.hit .reticle { border-color: #4ade80; }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #9aa3af; text-align: center; padding: 16px; background: #000;
  }
  #status { color: var(--muted); font-size: .9rem; min-height: 1.3em; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
  .code { word-break: break-all; }
  .muted { color: var(--muted); }
  .field { margin-top: 12px; }
  .photo { display: block; max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--border); margin-top: 4px; }
  ol.units { margin: 4px 0 0; padding: 0; list-style: none; }
  ol.units li { display: flex; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid var(--border); }
  ol.units .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; }
  ol.units .code { flex: 1; min-width: 0; }
  .saved { list-style: none; margin: 8px 0 0; padding: 0; }
  .saved > li { padding: 10px 0; border-top: 1px solid var(--border); }
  .saved .head { display: flex; gap: 10px; align-items: flex-start; }
  .saved .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); flex: none; }
  .saved .thumb.none { display: grid; place-items: center; color: var(--muted); font-size: .7rem; background: var(--bg); }
  .saved .info { flex: 1; min-width: 0; }
  .pill {
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 10px; font-size: .85rem; white-space: nowrap;
  }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Inventory Scanner</h1>

  <section>
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted></video>
      <div class="reticle"></div>
      <div class="placeholder" id="placeholder">Camera is off</div>
    </div>
    <div class="row">
      <button class="primary" id="toggleBtn">Start camera</button>
      <button id="photoBtn">Take photo</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="current" id="current"></section>

  <section>
    <form class="row" id="manualForm" autocomplete="off">
      <input type="text" id="manualInput" placeholder="Enter a code manually" aria-label="Manual code entry">
      <button type="submit">Add</button>
    </form>
  </section>

  <section>
    <div class="row spread">
      <h2>Saved items (<span id="itemCount">0</span>)</h2>
      <div class="row">
        <button class="primary" id="exportBtn">Export JSON</button>
        <button class="danger" id="clearBtn">Clear all</button>
      </div>
    </div>
    <ul class="saved" id="saved"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
  'use strict';

  /* =====================================================================
   * Data model
   *   item = {
   *     id, status: 'open' | 'done', createdAt, updatedAt,
   *     product: { value, scannedAt } | null,   // first scan: the product/case details code
   *     photo:   'data:image/jpeg;base64,...' | null,
   *     units:   [ { value, scannedAt } ]       // individual unit codes (e.g. each can)
   *   }
   * ===================================================================== */

  /* ---------- Persistence layer (IndexedDB; swap for fetch() to a REST API later) ---------- */
  const DB_NAME = 'inventory-scanner', DB_VERSION = 1, STORE = 'items';
  let dbPromise = null;

  function openDb() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }

  function tx(mode, fn) {
    return openDb().then(db => new Promise((resolve, reject) => {
      const t = db.transaction(STORE, mode);
      const result = fn(t.objectStore(STORE));
      t.oncomplete = () => resolve(result && result.result);
      t.onerror = t.onabort = () => reject(t.error);
    }));
  }

  const dbAll    = () => tx('readonly',  s => s.getAll());
  const dbPut    = item => tx('readwrite', s => s.put(item));
  const dbDelete = id => tx('readwrite', s => s.delete(id));
  const dbClear  = () => tx('readwrite', s => s.clear());

  /* ---------- In-memory state (source of truth for rendering; writes persist async) ---------- */
  let items = [];
  let activeId = null;

  const now = () => new Date().toISOString();
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const active = () => items.find(i => i.id === activeId) || null;

  function persist(item) {
    item.updatedAt = now();
    dbPut(item).catch(() => setStatus('Could not save to local storage.', 'error'));
  }

  function remove(id) {
    items = items.filter(i => i.id !== id);
    if (activeId === id) activeId = null;
    dbDelete(id).catch(() => setStatus('Could not delete from local storage.', 'error'));
  }

  function newItem() {
    const t = now();
    const item = { id: uid(), status: 'open', createdAt: t, updatedAt: t, product: null, photo: null, units: [] };
    items.push(item);
    activeId = item.id;
    persist(item);
    return item;
  }

  const ensureActive = () => active() || newItem();
  const isEmpty = it => !it.product && !it.photo && !it.units.length;

  function finishActive() {
    const it = active();
    if (!it) return;
    if (isEmpty(it)) remove(it.id);
    else { it.status = 'done'; persist(it); }
    activeId = null;
  }

  /* ---------- DOM helpers ---------- */
  const $ = id => document.getElementById(id);
  // Build elements with textContent only: QR contents are untrusted.
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) el.append(kid);
    return el;
  }

  const video = $('video'), viewport = $('viewport'), placeholder = $('placeholder');
  const toggleBtn = $('toggleBtn'), photoBtn = $('photoBtn'), statusEl = $('status');

  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = kind || '';
  }

  const fmtTime = iso => new Date(iso).toLocaleString();

  /* ---------- Rendering ---------- */
  function renderCurrent() {
    const root = $('current');
    root.textContent = '';
    const it = active();

    root.append(h('div', { class: 'row spread' },
      h('h2', {}, it ? 'Current item' : 'No item in progress'),
      it && h('span', { class: 'pill' }, it.units.length + ' unit' + (it.units.length === 1 ? '' : 's'))
    ));

    if (!it) {
      root.append(h('p', { class: 'muted' },
        'Scan a product code (or take a photo) to start a new item. The first code scanned is the product; every code after that is an individual unit.'));
      return;
    }

    root.append(h('div', { class: 'field' },
      h('div', { class: 'label' }, 'Product code'),
      it.product
        ? h('div', { class: 'row spread' },
            h('div', { class: 'code' }, it.product.value),
            h('button', { class: 'small', onclick: () => { it.product = null; persist(it); setStatus('Scan the product code.'); render(); } }, 'Re-scan'))
        : h('div', { class: 'muted' }, 'Waiting for scan…')
    ));

    root.append(h('div', { class: 'field' },
      h('div', { class: 'label' }, 'Photo'),
      it.photo ? h('img', { class: 'photo', src: it.photo, alt: 'Item photo' }) : h('div', { class: 'muted' }, 'None yet. Start the camera and tap "Take photo".')
    ));

    const list = h('ol', { class: 'units' });
    it.units.forEach((u, i) => list.append(h('li', {},
      h('span', { class: 'n' }, String(i + 1) + '.'),
      h('span', { class: 'code' }, u.value),
      h('button', { class: 'small danger', 'aria-label': 'Remove ' + u.value,
        onclick: () => { it.units.splice(i, 1); persist(it); render(); } }, '✕')
    )));
    root.append(h('div', { class: 'field' },
      h('div', { class: 'label' }, 'Units'),
      it.units.length ? list : h('div', { class: 'muted' }, 'Scan each individual unit code.')
    ));

    root.append(h('div', { class: 'row field' },
      h('button', { class: 'primary', id: 'finishBtn', onclick: () => { finishActive(); setStatus('Item saved.', 'ok'); render(); } }, 'Finish item'),
      h('button', { class: 'danger', onclick: () => {
        if (isEmpty(it) || confirm('Discard this item?')) { remove(it.id); setStatus('Item discarded.'); render(); }
      } }, 'Discard')
    ));
  }

  function renderSaved() {
    const list = $('saved');
    list.textContent = '';
    const saved = items.filter(i => i.id !== activeId)
                       .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    $('itemCount').textContent = saved.length;
    if (!saved.length) {
      list.append(h('li', { class: 'empty' }, 'No saved items yet'));
      return;
    }
    for (const it of saved) {
      list.append(h('li', {},
        h('div', { class: 'head' },
          it.photo ? h('img', { class: 'thumb', src: it.photo, alt: '' }) : h('div', { class: 'thumb none' }, 'no photo'),
          h('div', { class: 'info' },
            h('div', { class: 'code' }, it.product ? it.product.value : '(no product code)'),
            h('div', { class: 'muted', style: 'font-size:.8rem' }, fmtTime(it.updatedAt))
          ),
          h('span', { class: 'pill' }, it.units.length + ' unit' + (it.units.length === 1 ? '' : 's'))
        ),
        it.units.length ? h('details', {},
          h('summary', {}, 'Show units'),
          h('ol', { class: 'units' }, ...it.units.map((u, i) => h('li', {},
            h('span', { class: 'n' }, (i + 1) + '.'), h('span', { class: 'code' }, u.value))))
        ) : null,
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'small', onclick: () => { finishActive(); const t = items.find(x => x.id === it.id); t.status = 'open'; activeId = t.id; persist(t); render(); } }, 'Reopen'),
          h('button', { class: 'small danger', onclick: () => { if (confirm('Delete this item?')) { remove(it.id); render(); } } }, 'Delete')
        )
      ));
    }
  }

  function render() {
    renderCurrent();
    renderSaved();
    photoBtn.disabled = !stream;
  }

  /* ---------- Scan handling ---------- */
  const DEBOUNCE_MS = 2000;
  let lastValue = null, lastValueAt = 0;

  function feedback(ok) {
    if (ok) {
      viewport.classList.add('hit');
      setTimeout(() => viewport.classList.remove('hit'), 400);
    }
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [40, 40, 40]);
  }

  // First code in an item = product; later codes = units (unique within and across items).
  function applyScan(value) {
    const it = ensureActive();
    if (!it.product) {
      it.product = { value, scannedAt: now() };
      persist(it);
      return { ok: true, msg: 'Product: ' + value + ' — now scan the units' };
    }
    if (value === it.product.value) return { ok: false, msg: 'That is the product code (already set)' };
    if (it.units.some(u => u.value === value)) return { ok: false, msg: 'Already scanned in this item: ' + value };
    const other = items.find(o => o !== it && o.units.some(u => u.value === value));
    if (other) return { ok: false, msg: 'Already recorded in another item (' + (other.product ? other.product.value : 'no product code') + '): ' + value };
    it.units.push({ value, scannedAt: now() });
    persist(it);
    return { ok: true, msg: 'Unit ' + it.units.length + ': ' + value };
  }

  function handleScan(value, manual) {
    const t = Date.now();
    if (!manual && value === lastValue && t - lastValueAt < DEBOUNCE_MS) {
      lastValueAt = t;   // still in view: keep suppressing
      return;
    }
    lastValue = value; lastValueAt = t;
    const r = applyScan(value);
    feedback(r.ok);
    setStatus(r.msg, r.ok ? 'ok' : 'error');
    render();
  }

  /* ---------- Photo ---------- */
  const PHOTO_MAX = 1024, PHOTO_QUALITY = 0.8;

  function takePhoto() {
    if (!stream || !video.videoWidth) { setStatus('Start the camera first.', 'error'); return; }
    const scale = Math.min(1, PHOTO_MAX / Math.max(video.videoWidth, video.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(video.videoWidth * scale);
    c.height = Math.round(video.videoHeight * scale);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    const it = ensureActive();
    it.photo = c.toDataURL('image/jpeg', PHOTO_QUALITY);
    persist(it);
    if (navigator.vibrate) navigator.vibrate(30);
    setStatus('Photo captured.', 'ok');
    render();
  }

  /* ---------- Camera loop ---------- */
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let stream = null, rafId = 0, lastTick = 0;
  const SCAN_INTERVAL_MS = 100; // ~10 fps

  async function startCamera() {
    if (typeof jsQR !== 'function') {
      setStatus('QR decoder failed to load (check network). Manual entry still works.', 'error');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Camera API unavailable. Use HTTPS or localhost.', 'error');
      return;
    }
    toggleBtn.disabled = true;
    setStatus('Requesting camera…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      placeholder.hidden = true;
      toggleBtn.textContent = 'Stop camera';
      setStatus('Scanning…');
      lastTick = 0;
      rafId = requestAnimationFrame(tick);
    } catch (e) {
      stopCamera(true);
      const msgs = {
        NotAllowedError: 'Camera permission denied.',
        NotFoundError: 'No camera found.',
        NotReadableError: 'Camera is in use by another app.',
        OverconstrainedError: 'No camera matches the requested settings.'
      };
      setStatus(msgs[e.name] || ('Camera error: ' + (e.message || e.name)), 'error');
    } finally {
      toggleBtn.disabled = false;
      render();
    }
  }

  function stopCamera(keepStatus) {
    cancelAnimationFrame(rafId);
    rafId = 0;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    placeholder.hidden = false;
    toggleBtn.textContent = 'Start camera';
    if (!keepStatus) setStatus('Camera stopped.');
    render();
  }

  function tick(ts) {
    if (!stream) return;
    rafId = requestAnimationFrame(tick);
    if (ts - lastTick < SCAN_INTERVAL_MS) return;
    lastTick = ts;
    if (video.readyState < video.HAVE_ENOUGH_DATA || !video.videoWidth) return;

    // Downscale large frames to keep decoding fast.
    const scale = Math.min(1, 640 / video.videoWidth);
    const w = Math.round(video.videoWidth * scale), hgt = Math.round(video.videoHeight * scale);
    if (canvas.width !== w || canvas.height !== hgt) { canvas.width = w; canvas.height = hgt; }
    ctx.drawImage(video, 0, 0, w, hgt);
    const img = ctx.getImageData(0, 0, w, hgt);
    const code = jsQR(img.data, w, hgt, { inversionAttempts: 'dontInvert' });
    if (code && code.data) handleScan(code.data, false);
  }

  /* ---------- Export ---------- */
  const pad = n => String(n).padStart(2, '0');

  function exportJson() {
    const d = new Date();
    const out = items.slice().sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    const payload = { exportedAt: d.toISOString(), items: out };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'inventory-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
                 '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus('Exported ' + out.length + ' item(s).', 'ok');
  }

  /* ---------- Wiring ---------- */
  toggleBtn.addEventListener('click', () => { stream ? stopCamera() : startCamera(); });
  photoBtn.addEventListener('click', takePhoto);
  $('exportBtn').addEventListener('click', exportJson);
  $('clearBtn').addEventListener('click', () => {
    if (items.length && confirm('Delete ALL items?')) {
      items = []; activeId = null;
      dbClear().catch(() => setStatus('Could not clear local storage.', 'error'));
      setStatus('Cleared.');
      render();
    }
  });
  $('manualForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('manualInput');
    const v = input.value.trim();
    if (!v) return;
    handleScan(v, true);
    input.value = '';
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) stopCamera(); });

  render();
  dbAll().then(rows => {
    items = rows || [];
    const open = items.filter(i => i.status === 'open').sort((a, b) => b.updatedAt.localeCompare(a.updatedAt))[0];
    activeId = open ? open.id : null;
    render();
  }).catch(() => setStatus('Local storage unavailable: items will not be saved.', 'error'));
})();
</script>
</body>
</html>
